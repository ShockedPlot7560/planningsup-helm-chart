timezone: "Europe/Paris" 

imagePullSecrets: []

publicOrigin: "https://planningsup.app"

webapp:
  replicaCount: 1
  image:
    repository: ghcr.io/kernoeb/planningsup
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 20000
    nodePort: 31021

  envFrom: []
  env: []

  # Regles d'affinite Kubernetes natives (nodeAffinity, podAffinity, podAntiAffinity).
  # Rendues telles quelles : vous pouvez y mettre n'importe quelle regle.
  affinity: {}
  # Raccourci pour l'anti-affinite entre les replicas de la webapp :
  # "preferred" (preferee), "required" (obligatoire) ou "" (desactive).
  # Les termes generes sont ajoutes a webapp.affinity.podAntiAffinity.
  podAntiAffinityType: ""
  # Cles de topologie utilisees pour l'anti-affinite generee (un terme par cle).
  podAntiAffinityTopologyKeys:
    - kubernetes.io/hostname
    - topology.kubernetes.io/zone
  # Contraintes de repartition topologique Kubernetes natives (topologySpreadConstraints).
  topologySpreadConstraints: []

postgres:
  enabled: true
  replicaCount: 1
  
  user: "user"
  password: "password"
  dbName: "dbname"

  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    size: 5Gi