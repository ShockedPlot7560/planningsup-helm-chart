timezone: "Europe/Paris" 

web:
  replicaCount: 1
  image:
    repository: ghcr.io/kernoeb/planningsup/planning
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000

mongodb:
  replicaCount: 1
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  service:
    port: 27017
  persistence:
    size: 5Gi