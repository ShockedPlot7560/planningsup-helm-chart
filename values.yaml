timezone: "Europe/Paris" 

imagePullSecrets: []

publicOrigin: "https://planningsup.app"

webapp:
  replicaCount: 1
  image:
    repository: ghcr.io/kernoeb/planningsup
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 20000
    nodePort: 31021

  envFrom: []

postgres:
  enabled: true
  replicaCount: 1
  
  user: "user"
  password: "password"
  dbName: "dbname"

  image:
    repository: postgres
    tag: "18"
    pullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    size: 5Gi