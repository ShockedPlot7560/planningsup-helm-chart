---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webapp
spec:
  type: {{ .Values.webapp.service.type }}
  ports:
    - port: {{ .Values.webapp.service.port }}
      targetPort: 20000
      nodePort: {{ .Values.webapp.service.nodePort }}
  selector:
    app: webapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          command:
            - sh
            - -c
            - |
              echo "En attente de la base de données PostgreSQL..."
              until pg_isready -h {{ .Release.Name }}-postgres -p 5432; do
                sleep 2
              done
              echo "PostgreSQL est prêt !"
      
      containers:
        - name: webapp
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.webapp.image.pullPolicy }}
          ports:
            - containerPort: 20000
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-webapp-config
          {{- if .Values.plannings }}
          volumeMounts:
            - name: web-plannings-volume
              mountPath: /app/resources/plannings/
          {{- end }}
      {{- if .Values.plannings }}
      volumes:
        - name: web-plannings-volume
          configMap:
            name: {{ .Release.Name }}-web-plannings
      {{- end }}


{{- if .Values.plannings }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-web-plannings
data:
  {{- range $filename, $content := .Values.plannings }}
  {{ $filename }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}