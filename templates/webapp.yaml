---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-webapp
spec:
  type: {{ .Values.webapp.service.type }}
  ports:
    - port: {{ .Values.webapp.service.port }}
      targetPort: 20000
  selector:
    app: webapp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-webapp
spec:
  replicas: {{ .Values.webapp.replicaCount }}
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
      annotations:
        {{- if .Values.plannings }}
        checksum/config: {{ include (print $.Template.BasePath "/plannings-configmap.yaml") . | sha256sum }}
        {{- end }}
    spec:
      {{- $antiAffinityType := .Values.webapp.podAntiAffinityType | default "" }}
      {{- if not (has $antiAffinityType (list "" "preferred" "required")) }}
      {{- fail "webapp.podAntiAffinityType doit valoir \"preferred\", \"required\" ou \"\" (desactive)" }}
      {{- end }}
      {{- $affinity := deepCopy (.Values.webapp.affinity | default dict) }}
      {{- if $antiAffinityType }}
      {{- $topologyKeys := .Values.webapp.podAntiAffinityTopologyKeys | default (list "kubernetes.io/hostname" "topology.kubernetes.io/zone") }}
      {{- if not $topologyKeys }}
      {{- fail "webapp.podAntiAffinityTopologyKeys ne peut pas etre vide quand webapp.podAntiAffinityType est defini" }}
      {{- end }}
      {{- $labelSelector := dict "matchLabels" (dict "app" "webapp") }}
      {{- $podAntiAffinity := get $affinity "podAntiAffinity" | default dict }}
      {{- if eq $antiAffinityType "required" }}
      {{- $terms := list }}
      {{- range $topologyKeys }}
      {{- $terms = append $terms (dict "labelSelector" $labelSelector "topologyKey" .) }}
      {{- end }}
      {{- $required := get $podAntiAffinity "requiredDuringSchedulingIgnoredDuringExecution" | default list }}
      {{- $_ := set $podAntiAffinity "requiredDuringSchedulingIgnoredDuringExecution" (concat $required $terms) }}
      {{- else }}
      {{- $weight := max 1 (div 100 (len $topologyKeys)) }}
      {{- $terms := list }}
      {{- range $topologyKeys }}
      {{- $terms = append $terms (dict "weight" $weight "podAffinityTerm" (dict "labelSelector" $labelSelector "topologyKey" .)) }}
      {{- end }}
      {{- $preferred := get $podAntiAffinity "preferredDuringSchedulingIgnoredDuringExecution" | default list }}
      {{- $_ := set $podAntiAffinity "preferredDuringSchedulingIgnoredDuringExecution" (concat $preferred $terms) }}
      {{- end }}
      {{- $_ := set $affinity "podAntiAffinity" $podAntiAffinity }}
      {{- end }}
      {{- with $affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.webapp.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: webapp
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.webapp.image.pullPolicy }}
          ports:
            - containerPort: 20000
          {{- with .Values.webapp.env }}
          env:
          {{- toYaml . | nindent 10 }}
          {{- end }}
          envFrom:
            {{- with .Values.webapp.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            - configMapRef:
                name: {{ .Release.Name }}-webapp-config
          {{- if .Values.plannings }}
          volumeMounts:
            - name: web-plannings-volume
              mountPath: /app/plannings
          {{- end }}
          {{- if .Values.webapp.command }}
          command: 
          {{- toYaml .Values.webapp.command | nindent 12 }}
          {{- end }}
          {{- if .Values.webapp.args }}
          args:
          {{- toYaml .Values.webapp.args | nindent 12 }}
          {{- end }}

          resources:
            requests:
              cpu: "10m"
              memory: "100Mi"
            limits:
              cpu: "200m"
              memory: "150Mi"
      {{- if .Values.plannings }}
      volumes:
        - name: web-plannings-volume
          configMap:
            name: {{ .Release.Name }}-web-plannings
      {{- end }}
